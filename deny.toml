[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Avis « unmaintained » : liste explicite des avis acceptés (réexamen R39
# 2026-11-25 puis R54, vérification du 2026-11-24 : dernières versions publiées,
# aucun remplaçant direct). `unmaintained = "all"` : toute nouvelle crate non
# maintenue, directe ou transitive, fait échouer cargo-deny tant qu'elle n'est
# pas ajoutée ici avec sa crate parente. Détail dans docs/security/dependances.md
# et .agents/memory/decisions.md. À réexaminer à chaque montée de pingora, age
# ou testcontainers.
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45, tirée par pingora-core 0.9.1 (dernière version), pas de remplaçant" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11, tirée par serde_yaml 0.9.34+deprecated puis pingora-core 0.9.1 ; le YAML de Pingora n'est jamais chargé (clippy.toml)" },
    { id = "RUSTSEC-2024-0388", reason = "derivative 2.2.0, macro de compilation tirée par pingora-core 0.9.1" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0, tirée par pingora-rustls 0.9.1" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml 0.1.10, macro de compilation (i18n-config) tirée par age 0.11.5, toujours présente dans age 0.12.1" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 2.0.1, macro de compilation (i18n-embed-fl) tirée par age 0.11.5, toujours présente dans age 0.12.1" },
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar 0.6.4, dev-dependency de testcontainers (tests du plan de contrôle seulement), toujours dans testcontainers 0.28.0" },
]

[licenses]
version = 2
# Licences permissives ou a copyleft faible, compatibles avec AGPL-3.0-only.
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Equivalent domaine public (quoted_printable, via lettre).
    "0BSD",
    # Donnees des racines de confiance (webpki-roots, via sqlx TLS).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []