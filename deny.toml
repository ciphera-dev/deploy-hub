[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Avis « unmaintained » acceptés (réexamen R39, 2026-11-25 ; décision dans
# .agents/memory/decisions.md, détail dans docs/security/dependances.md).
# `unmaintained = "workspace"` : cargo deny ne signale que les crates directes
# du workspace, aucune n'est concernée. cargo audit les affiche en avertissements
# (non bloquants). Aucun remplaçant direct n'existe à ce jour :
# - chrono (RUSTSEC-2026-0543), serde_yaml -> unsafe-libyaml
#   (RUSTSEC-2024-0449), derivative (RUSTSEC-2024-0388), rustls-pemfile
#   (RUSTSEC-2025-0134) : tirés par pingora-core 0.9.1, dernière version
#   publiée ; Pingora reste en 0.9.x (le proxy dépend de ses internes) ;
# - basic-toml (RUSTSEC-2026-0374), proc-macro-error2 (RUSTSEC-2026-0173) :
#   macros de compilation de age (i18n-embed-fl), toujours présentes dans
#   age 0.12.1 ; rien n'est lié au binaire ;
# - astral-tokio-tar (RUSTSEC-2026-0440) : testcontainers, dev-dependency des
#   tests du plan de contrôle seulement, toujours dans testcontainers 0.28.0.
# Réexaminer à chaque montée de pingora, age ou testcontainers.
# DEP-2 : à réexaminer aussi à chaque nouvelle version de pingora-core ou de
# webauthn-rs (RUSTSEC-2023-0071, ci-dessus).
unmaintained = "workspace"
ignore = [
    # rsa (attaque Marvin, aucune version corrigée), tiré par webauthn-rs via crypto-glue.
    # Ciphera ne fait que vérifier des signatures avec des clés publiques : aucun
    # déchiffrement ni signature RSA avec une clé privée. Décision du 2026-11-21
    # (.agents/memory/decisions.md), à réexaminer à chaque montée de webauthn-rs.
    # Les tests de la GitHub App (dev-dependency, même version) ne s'en servent que
    # pour générer une clé jetable ; le JWT de l'App est signé par ring (2026-11-22).
    { id = "RUSTSEC-2023-0071", reason = "rsa : vérification par clé publique (WebAuthn) et génération de clés de test seulement ; aucune signature ni déchiffrement par clé privée en production" },
]

[licenses]
version = 2
# Licences permissives ou a copyleft faible, compatibles avec AGPL-3.0-only.
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Equivalent domaine public (quoted_printable, via lettre).
    "0BSD",
    # Donnees des racines de confiance (webpki-roots, via sqlx TLS).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []