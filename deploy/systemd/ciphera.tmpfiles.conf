# Dossiers des sockets Unix de Ciphera et etat de BuildKit (systemd-tmpfiles,
# recrees a chaque demarrage ; /etc/tmpfiles.d/ciphera.conf).
#
# /run/ciphera/postgres : socket de PostgreSQL (conteneur ciphera-postgres,
# compte ciphera-postgres) ; le plan de controle (groupe ciphera) s'y
# connecte. /run/ciphera/proxy.sock : socket de pilotage du proxy, cree par
# ciphera-proxy.socket (0660, groupe ciphera-agent). Le parent est en 0751 :
# les autres comptes peuvent le traverser (l'agent, vers proxy.sock) mais
# pas le lister, et chaque entree reste fermee par ses propres droits.
# /run/ciphera-agent/buildkit : socket de buildkitd. buildkitd rootless tourne
# sous le compte systeme dedie ciphera-build (jamais l'uid 1000 de l'image
# moby/buildkit:rootless) et cree son socket (0660) ici. Le dossier est
# setgid (2770) au groupe ciphera-agent : le socket herite de ce groupe a sa
# creation et buildkitd, lance avec --group=-1, ne le change pas
# (chown(uid, -1)). Aucune ACL : leur heritage par defaut n'a pas tenu sur
# l'hote de la CI. Le parent /run/ciphera-agent (0750) ferme ce chemin aux
# autres comptes ; seuls ciphera-build (compte systeme sans shell, sous
# lequel tourne buildkitd) et root l'atteignent aussi par /proc/<pid>/root.
# /var/lib/ciphera-buildkit : etat de buildkitd (cache, couches), au seul
# compte ciphera-build, monte comme son HOME dans le conteneur.
# /var/backups/ciphera : sauvegardes de la base avant mise a jour
# (ciphera-cli updater, root seulement).
# Parents a root : systemd-tmpfiles refuse de passer d'un dossier d'un compte
# non root a un dossier d'un autre compte (« unsafe path transition »).
d /run/ciphera 0751 root ciphera - -
d /run/ciphera/postgres 0750 ciphera-postgres ciphera - -
d /run/ciphera-agent 0750 root ciphera-agent - -
d /run/ciphera-agent/buildkit 2770 ciphera-build ciphera-agent - -
d /var/lib/ciphera-buildkit 0700 ciphera-build ciphera-build - -
d /var/backups/ciphera 0700 root root - -
