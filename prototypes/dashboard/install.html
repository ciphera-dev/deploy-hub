            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>{[['public','globe','Domaine public','Via votre domaine et HTTPS'],['vpn','shield','Tailscale (VPN)','Privé, sans exposition publique']].map(([k,ic,t,s])=>{const on=d.mode===k;return <button key={k} onClick={()=>setD({...d,mode:k})} style={{display:'flex',alignItems:'center',gap:12,padding:'14px',borderRadius:12,cursor:'pointer',textAlign:'left',border:'1px solid '+(on?'var(--border-strong)':'var(--border-subtle)'),background:on?'var(--surface-raised)':'transparent'}}><span style={{width:36,height:36,borderRadius:10,flex:'none',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--surface-selected)'}}><Icon name={ic} size={16} color="var(--text-strong)"/></span><span style={{display:'flex',flexDirection:'column',gap:6,flex:1}}><span style={{font:'500 13px/1 var(--font-sans)',color:'var(--text-strong)'}}>{t}</span><span style={{...lbl,fontSize:11}}>{s}</span></span><span style={{width:18,height:18,borderRadius:99,flex:'none',border:'2px solid '+(on?'#8b7cf6':'var(--border-strong)'),display:'flex',alignItems:'center',justifyContent:'center'}}>{on&&<span style={{width:8,height:8,borderRadius:99,background:'#8b7cf6'}}></span>}</span></button>})}</div>

            {st>0&&st<4&&<Btn ghost onClick={()=>setSt(s=>s-1)}>Retour</Btn>}
            <span style={{flex:1}}></span>
            {st<4?<Btn disabled={!ok} icon="arrow-right" onClick={()=>setSt(s=>s+1)}>{st===3?'Installer':'Continuer'}</Btn>:<Btn disabled={fin<4} icon="log-in" onClick={()=>{location.href='login.html'}}>Aller à la connexion</Btn>}
          </div>
        </div>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Install/>);
</script></body></html>
