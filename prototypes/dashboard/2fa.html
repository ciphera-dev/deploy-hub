        {step==='forgot'&&<div style={{display:'flex',flexDirection:'column',gap:16,animation:'fadeUp .25s ease-out'}}>
          {H('Réinitialiser le mot de passe')}
          <span style={{font:'400 13px/1.5 var(--font-sans)',color:'var(--text-muted)',textAlign:'center'}}>Un lien sera envoyé via le serveur SMTP configuré sur cette instance.</span>
          <In label="E-mail" value={email} onChange={setEmail} autoFocus/>
          <Primary onClick={()=>setStep('sent')} disabled={!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)}>Envoyer le lien</Primary>
          <button onClick={()=>setStep('login')} style={{padding:0,border:0,background:'transparent',cursor:'pointer',font:'500 14px/1 var(--font-sans)',color:'var(--text-strong)'}}>Retour à la connexion</button>
        </div>}
        {step==='sent'&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',textAlign:'center',gap:14,animation:'fadeUp .25s ease-out'}}><span style={{width:48,height:48,borderRadius:99,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(134,239,172,.12)'}}><Icon name="mail-check" size={20} color="#86efac"/></span>{H('Vérifiez votre boîte mail')}<span style={{font:'400 13px/1.5 var(--font-sans)',color:'var(--text-muted)'}}>Si un compte existe pour {email}, un lien valable 30 minutes vient d'être envoyé.</span><button onClick={()=>setStep('login')} style={{marginTop:6,padding:0,border:0,background:'transparent',cursor:'pointer',color:'#a78bfa',font:'500 13px/1 var(--font-sans)'}}>Retour à la connexion</button></div>}
        {step==='ok'&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14,paddingTop:40,animation:'fadeUp .25s ease-out'}}><Icon name="loader" size={22} color="#a78bfa" style={{animation:'spin 1s linear infinite'}}/><span style={{font:'500 14px/1 var(--font-sans)',color:'var(--text-strong)'}}>Ouverture du dashboard…</span></div>}
      </div>
    </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Login/>);
</script></body></html>
