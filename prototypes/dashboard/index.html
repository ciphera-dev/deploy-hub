<script type="text/babel">
const HOME="Vue d'ensemble";
const ACTIONS={'Tickets':['plus','Nouveau ticket','ticket'],'Bases de données':['plus','Nouvelle base','db'],'Équipe':['user-plus','Créer un utilisateur','user'],'Projets':['plus','Nouveau projet','project'],'Serveurs':['plus','Ajouter un serveur','server'],'Connecteurs':['plus','Ajouter un connecteur','connector'],'Paramètres':['plus','Ajouter un secret','secret'],'Sécurité':['ban','Bannir une IP','ban'],'Variables globales':['plus','Nouvelle variable','gvar']};
function App(){
  const {Button}=window.CipheraDesignSystem;
  const [nav,setNav]=React.useState(()=>{const v=localStorage.getItem('ciphera-nav');return v&&(v===HOME||ACTIONS[v]||v==='Monitoring'||v==='Profil'||v==='Sécurité'||v==='Variables globales'||window.CIPHERA_PAGES[v])?v:HOME});
  const [detail,setDetail]=React.useState(null);
  const [modal,setModal]=React.useState(null);
  const [importRepo,setImportRepo]=React.useState(null);
  const [period,setPeriod]=React.useState('30 derniers jours');
  const [collapsed,setCollapsed]=React.useState(localStorage.getItem('ciphera-sidebar')==='1');
  React.useEffect(()=>localStorage.setItem('ciphera-nav',nav),[nav]);
  React.useEffect(()=>localStorage.setItem('ciphera-sidebar',collapsed?'1':'0'),[collapsed]);
  React.useEffect(()=>{const f=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='b'){e.preventDefault();setCollapsed(v=>!v)}};window.addEventListener('keydown',f);return()=>window.removeEventListener('keydown',f)},[]);
  const go=(n,d=null)=>{setNav(n);setDetail(d)};
  const p=window.CIPHERA.periods[period];
  const A=ACTIONS[nav];
  const close=()=>setModal(null);
  let body;
  if(nav===HOME) body=<OverviewV2 go={setNav}/>;
  else if(nav==='Déploiements') body=<DeploymentsPage/>;
  else if(nav==='Webhooks') body=<WebhooksPage/>;
  else if(nav==='Raccourcis clavier') body=<ShortcutsPage/>;
  else if(nav==='Documentation') body=<DocsPage/>;
  else if(nav==='Projets') body=detail?<ProjectDetail id={detail} back={()=>setDetail(null)}/>:<ProjectsListV2 open={setDetail} onImport={r=>{setImportRepo(r||null);setModal('project')}}/>;
  else if(nav==='Serveurs') body=detail?<ServerDetail id={detail} back={()=>setDetail(null)}/>:<ServersList open={setDetail}/>;
  else if(nav==='Monitoring') body=<MonitoringV2 go={setNav}/>;
  else if(nav==='Sécurité') body=<SecurityPage banOpen={modal==='ban'} closeBan={close} onNav={setNav}/>;
  else if(nav==='Variables globales') body=<GlobalVariablesPage addOpen={modal==='gvar'} closeAdd={close}/>;
  else if(nav==='Bases de données') body=<DatabasesPage addOpen={modal==='db'} closeAdd={close}/>;
  else if(nav==='Profil') body=<ProfilePage/>;
  else if(nav==='Clés API') body=<ApiPage/>;
  else if(nav==='Domaines') body=<DomainsPage/>;
  else if(nav==='Équipe') body=<TeamPage addOpen={modal==='user'} closeAdd={close}/>;
  else if(nav==='Conteneurs') body=<DockerPage/>;
  else if(nav==='Tickets') body=<TicketsPage addOpen={modal==='ticket'} closeAdd={close} onNav={setNav}/>;
  else if(nav==='Connecteurs') body=<ConnectorsPageV2 addOpen={modal==='connector'} closeAdd={close}/>;
  else if(nav==='Paramètres') body=<SettingsV2 openSecret={()=>setModal('secret')}/>;
  else body=<ResourcePage page={nav}/>;
  const wrap=nav!==HOME;
  const {IconButton,BrandMark,Icon}=window.CipheraDesignSystem;
  const theme=window.useCipheraTheme?window.useCipheraTheme():null;
  return <div style={{display:'flex',flexDirection:'column',height:'100%',background:window.cipheraThemeBg?window.cipheraThemeBg(theme):'#050505',transition:'background .4s'}}>
    <div style={{position:'relative',flex:'none',display:'grid',gridTemplateColumns:'1fr auto 1fr',alignItems:'center',height:56,padding:'0 14px 0 18px',overflow:'hidden',color:'#fff','--text-strong':'#fff','--text-body':'rgba(255,255,255,.9)','--text-muted':'rgba(255,255,255,.8)','--text-subtle':'rgba(255,255,255,.72)','--surface-control-hover':'rgba(255,255,255,.12)','--border-strong':'rgba(255,255,255,.2)','--surface-control':'rgba(10,10,14,.35)'}}>
      <div style={{position:'absolute',inset:0,background:'transparent',pointerEvents:'none'}}></div>
      <div style={{position:'relative',display:'flex',alignItems:'center',gap:14}}>
        <BrandMark/>
        <IconButton variant="ghost" size={28} icon={collapsed?'panel-left-open':'panel-left-close'} label="Menu" onClick={()=>setCollapsed(v=>!v)}/>
        <WorkspaceSwitcher/>
      </div>
      <button onClick={()=>{}} style={{position:'relative',display:'flex',alignItems:'center',gap:10,width:420,height:34,padding:'0 6px 0 12px',borderRadius:99,background:'rgba(10,10,14,.45)',backdropFilter:'blur(10px)',WebkitBackdropFilter:'blur(10px)',border:'1px solid rgba(255,255,255,.18)',cursor:'text',color:'rgba(255,255,255,.75)',font:'400 13px/1 var(--font-sans)'}}><Icon name="search" size={14}/><span style={{flex:1,textAlign:'left'}}>Rechercher un projet, un serveur, un domaine…</span><span style={{height:22,display:'flex',alignItems:'center',padding:'0 7px',borderRadius:99,background:'rgba(255,255,255,.14)',font:'500 11px/1 var(--font-mono)',color:'#fff'}}>⌘K</span></button>
      <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'flex-end',gap:8}}>
        <NotificationsBell onNav={setNav}/>
        <span title="Alex Martin" style={{width:34,height:34,borderRadius:99,border:'1px solid rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'default'}}><CipheraAvatar size={30} dot={false}/></span>
      </div>
    </div>
    <div style={{flex:1,minHeight:0,display:'flex',margin:'0 8px 8px',borderRadius:20,border:'1px solid rgba(255,255,255,.09)',overflow:'hidden',background:'var(--surface-app)',boxShadow:'0 0 0 1px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.55)'}}>
      <div style={{flex:'none',height:'100%',background:'var(--surface-sidebar)',borderRight:'1px solid var(--border-subtle)',overflow:'auto'}}><AppSidebar active={nav} onNav={n=>go(n)} collapsed={collapsed} onToggle={()=>setCollapsed(v=>!v)}/></div>
      <main style={{flex:1,minWidth:0,overflowY:'auto',overflowX:'hidden'}}>
        <div style={{maxWidth:1180,margin:'0 auto',padding:'14px 8px 0'}}>
          {nav!==HOME&&<DashboardHeader title={nav} period={period} setPeriod={setPeriod} range={p.range} actions={nav===HOME?null:(A&&!detail?<Button variant="inverse" icon={A[0]} onClick={()=>setModal(A[2])}>{A[1]}</Button>:<span/>)}/>}
          {body}
        </div>
      </main>
    </div>
    {modal==='project'&&<NewProjectModal initial={importRepo} onClose={()=>{close();setImportRepo(null)}} onCreate={()=>{close();setImportRepo(null);go('Projets','web')}}/>}
    {modal==='server'&&<AddServerModal onClose={close}/>}
    
    {modal==='secret'&&<SecretModal onClose={close}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script><script>(()=>{const t=document.createElement('div');t.id='cph-tip';t.style.cssText='position:fixed;z-index:9999;pointer-events:none;opacity:0;transform:translateY(4px) scale(.98);transition:opacity .12s ease,transform .12s ease;padding:7px 10px;border-radius:8px;background:rgba(24,24,28,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.45);color:#ededed;font:500 12px/1.35 Geist,Inter,system-ui,sans-serif;max-width:260px;white-space:normal;backdrop-filter:blur(8px)';document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(t));let cur=null,tm=null;
const show=el=>{const txt=el.getAttribute('data-tip');if(!txt)return;t.textContent=txt;const r=el.getBoundingClientRect();t.style.left='0px';t.style.top='0px';t.style.opacity='0';const w=t.offsetWidth,hh=t.offsetHeight;let x=r.left+r.width/2-w/2,y=r.top-hh-8;let below=false;if(y<6){y=r.bottom+8;below=true}x=Math.max(8,Math.min(innerWidth-w-8,x));t.style.left=x+'px';t.style.top=y+'px';t.style.transform=below?'translateY(-4px) scale(.98)':'translateY(4px) scale(.98)';requestAnimationFrame(()=>{t.style.opacity='1';t.style.transform='translateY(0) scale(1)'})};
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[title],[data-tip]');if(!el||el===cur)return;if(el.hasAttribute('title')){const v=el.getAttribute('title');if(v){el.setAttribute('data-tip',v)}el.removeAttribute('title')}cur=el;clearTimeout(tm);tm=setTimeout(()=>show(el),350)},true);
document.addEventListener('mouseout',e=>{if(cur&&(!e.relatedTarget||!cur.contains(e.relatedTarget))){cur=null;clearTimeout(tm);t.style.opacity='0'}},true);
document.addEventListener('mousedown',()=>{clearTimeout(tm);t.style.opacity='0'},true);addEventListener('scroll',()=>{t.style.opacity='0'},true)})();</script></body></html>
