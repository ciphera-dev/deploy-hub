<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../../web/src/styles/index.css"><style>body{padding:20px;background:var(--surface-app)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:76px}.chip{height:48px;border-radius:8px;border:1px solid var(--border-default)}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-subtle);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--gray-50)"></div><div class="n">50</div><div class="v">--gray-50</div></div><div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="n">100</div><div class="v">--gray-100</div></div><div class="sw"><div class="chip" style="background:var(--gray-150)"></div><div class="n">150</div><div class="v">--gray-150</div></div><div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="n">200</div><div class="v">--gray-200</div></div><div class="sw"><div class="chip" style="background:var(--gray-350)"></div><div class="n">350</div><div class="v">--gray-350</div></div><div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="n">500</div><div class="v">--gray-500</div></div><div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="n">700</div><div class="v">--gray-700</div></div><div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="n">900</div><div class="v">--gray-900</div></div></div></body></html>
