<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../../web/src/styles/index.css"><style>body{padding:20px;background:var(--surface-app)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:76px}.chip{height:48px;border-radius:8px;border:1px solid var(--border-default)}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-subtle);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--green-500)"></div><div class="n">Positive</div><div class="v">--green-500</div></div><div class="sw"><div class="chip" style="background:var(--green-900)"></div><div class="n">Positive bg</div><div class="v">--green-900</div></div><div class="sw"><div class="chip" style="background:var(--red-500)"></div><div class="n">Negative</div><div class="v">--red-500</div></div><div class="sw"><div class="chip" style="background:var(--red-900)"></div><div class="n">Negative bg</div><div class="v">--red-900</div></div></div><div style="margin-top:10px;width:60px;height:24px;border-radius:999px;background:var(--grad-brand)"></div><div class="v" style="margin-top:4px">--grad-brand (workspace avatar only)</div></body></html>
