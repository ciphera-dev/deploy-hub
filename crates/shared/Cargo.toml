[package]
name = "shared"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "shared"

[features]
# IntoResponse (axum) pour ApiError : active par le control-plane.
axum = ["dep:axum", "dep:serde_json"]
# sqlx::Type sur les identifiants : active par le control-plane.
sqlx = ["dep:sqlx"]
# Coffre age (SecretBox) : plan de controle (secrets en base) et proxy
# (certificats au repos).
age = ["dep:age", "dep:zeroize", "dep:rustix"]
# Demande de mise a jour signee (HMAC, cle propre `update-hmac.key`, sans
# lien avec l'identite age) : plan de controle (depot) et updater de la CLI
# (verification, creation de la cle si elle manque).
update = ["dep:hmac", "dep:sha2", "dep:serde_json", "dep:zeroize", "dep:rustix", "dep:getrandom"]
# Derniere version publiee signee (`latest.json` + minisign, cles integrees
# `install/ciphera.pub`) : plan de controle (panneau) et updater de la CLI.
latest = ["update", "dep:minisign-verify"]

[dependencies]
age = { version = "0.11", optional = true }
zeroize = { version = "1.9.2", optional = true }
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
# Cle des demandes de mise a jour (32 octets aleatoires) ; version deja
# presente dans l'arbre des dependances (rand 0.10).
getrandom = { version = "0.4.3", default-features = false, optional = true }
# Meme verificateur minisign que l'updater de la CLI (deja dans l'arbre).
minisign-verify = { version = "0.3.0", optional = true }
axum = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }