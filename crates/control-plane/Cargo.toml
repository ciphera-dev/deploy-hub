[package]
name = "control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "control_plane"
path = "src/lib.rs"

[[bin]]
name = "ciphera"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen-openapi.rs"

[features]
default = ["embed"]
# Embarque web/dist dans le binaire. Sans elle, l'interface repond 503
# (permet un `cargo check` sans avoir construit web/).
embed = ["dep:rust-embed"]

[dependencies]
age = "0.11"
# Masquage des secrets dans les journaux : un automate pour tous les motifs
# (temps lineaire en la longueur de la ligne).
aho-corasick = "1.1.5"
argon2 = "0.6.0"
api-types = { path = "../api-types" }
axum = { workspace = true, features = ["http1", "tokio", "query", "ws"] }
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-ring"] }
base64 = "0.23.1"
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
http-body = "1.1"
pki = { path = "../pki" }
proto = { path = "../proto" }
# Liste des suffixes publics embarquee (sans reseau) : domaine enregistrable
# de l'hote du panneau, pour `includeSubDomains` du HSTS.
psl = "2.1.263"
# Lien QUIC + mTLS avec les agents : rustls + ring (ni aws-lc, ni OpenSSL).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rand = { version = "0.10.4", default-features = false, features = ["sys_rng"] }
# Client de l'API GitHub : rustls avec ring (fournisseur passe explicitement,
# racines webpki-roots), ni aws-lc, ni OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
# Signature RS256 du JWT de la GitHub App (pas la crate `rsa`, RUSTSEC-2023-0071).
ring = "0.17.14"
webpki-roots = "1.0.12"
rust-embed = { version = "8.14.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = "0.13.0"
# Avatars : PNG, JPEG et WebP seulement (aucun autre decodeur compile).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Validation des fuseaux horaires IANA du profil (base IANA embarquee :
# meme resultat quel que soit le systeme ; chrono-tz est non maintenu).
jiff = { version = "1.0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# SMTP : TLS rustls (ring, certificats du systeme), sans native-tls ni OpenSSL.
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs"] }
sha2 = "0.11.1"
shared = { path = "../shared", features = ["axum", "sqlx", "age", "update"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-ring-webpki", "migrate", "macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", default-features = false, features = ["set-header"] }
tower-service = "0.3.3"
subtle = "2.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid = { workspace = true }
zeroize = { version = "1.9.2", features = ["serde"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"] }
qrcodegen = "1.8.0"
webauthn-rs = { version = "0.6.2", default-features = false, features = ["danger-allow-state-serialisation", "conditional-ui"] }

[dev-dependencies]
ciphera-agent = { path = "../agent" }
tokio = { workspace = true, features = ["test-util"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
wiremock = "0.6.5"
# Client WebSocket des tests des logs en direct (meme version que celle
# d'axum `ws`, sans TLS).
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# Tests seulement : genere la cle RSA jetable de la GitHub App simulee (aucune
# signature ni dechiffrement par cette crate ; voir deny.toml).
rsa = "=0.10.0-rc.19"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
