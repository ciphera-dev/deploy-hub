[package]
name = "pki"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pki"

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
rand = { version = "0.10.4", default-features = false, features = ["sys_rng"] }
sha2 = "0.11.1"
shared = { path = "../shared" }
zeroize = "1.9.2"
time = { version = "0.3", default-features = false, features = ["std"] }
# `verify` : signature d'un certificat verifiee par la cle de la CA (ring,
# deja present par rcgen).
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
x509-parser = "0.18.1"
